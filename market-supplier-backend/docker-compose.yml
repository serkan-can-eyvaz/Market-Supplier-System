services:
  backend:
    build: .
    container_name: market-supplier-backend
    ports:
      - "8480:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://hairdresser-db:5432/tedarikAsistanıDB
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 2323
    networks:
      - barber-automation_default

volumes:
  postgres_data:

networks:
  barber-automation_default:
    external: true