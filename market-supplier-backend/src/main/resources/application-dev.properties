# Development Environment Configuration
spring.profiles.active=dev

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/tedarikAsistanıDB
spring.datasource.username=postgres
spring.datasource.password=2323
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0

# Logging Configuration
app.logging.level=DEBUG
app.logging.structured=true
app.logging.include-stack-trace=true
app.logging.service-name=market-supplier-dev

# Feature Flags
app.features.ai-agent.enabled=true
app.features.whatsapp.enabled=true
app.features.redis.enabled=true
app.features.circuit-breaker.enabled=true
app.features.rate-limiting.enabled=true
app.features.validation.enabled=true
app.features.logging.enabled=true
app.features.caching.enabled=true
app.features.async-processing.enabled=true

# AI Configuration
app.ai.provider=groq
app.ai.model=gpt-3.5-turbo
app.ai.max-tokens=1000
app.ai.temperature=0.7
app.ai.timeout=30000

# WhatsApp Configuration
app.whatsapp.access_token=dev_access_token
app.whatsapp.phone_number_id=dev_phone_number_id
app.whatsapp.verify_token=dev_verify_token
app.whatsapp.webhook_url=http://localhost:8080/api/whatsapp/webhook

# JWT Configuration
app.jwt.secret=dev_jwt_secret_key_very_long_and_secure
app.jwt.expiration=3600000
app.jwt.refresh-expiration=86400000

# Rate Limiting Configuration
app.rate-limit.window-size-ms=60000
app.rate-limit.max-per-window=100
app.rate-limit.max-per-minute=60
app.rate-limit.max-per-hour=1000

# Circuit Breaker Configuration
app.circuit-breaker.failure-threshold=3
app.circuit-breaker.timeout-duration=30
app.circuit-breaker.retry-timeout=15

# Retry Configuration
app.retry.max-attempts=2
app.retry.initial-delay=500
app.retry.max-delay=5000
app.retry.multiplier=2.0
app.retry.jitter=true

# Cache Configuration
app.cache.enabled=true
app.cache.default-ttl=300
app.cache.local-fallback=true
app.cache.redis.enabled=true

# Async Configuration
app.async.core-pool-size=2
app.async.max-pool-size=10
app.async.queue-capacity=50
app.async.thread-name-prefix=Dev-Async-

# Resilience Configuration
app.resilience.llm.enabled=true
app.resilience.redis.enabled=true
app.resilience.whatsapp.enabled=true

# Security Configuration
app.security.input-sanitization.enabled=true
app.security.rate-limiting.enabled=true
app.security.jwt-validation.enabled=true

# Monitoring Configuration
app.monitoring.enabled=true
app.monitoring.metrics.enabled=true
app.monitoring.health-check.enabled=true
app.monitoring.actuator.enabled=true

# Server Configuration
server.port=8080
server.servlet.context-path=/
server.error.include-stacktrace=always
server.error.include-message=always

# Admin Configuration
app.admin.bootstrap-token=dev_admin_token
app.admin.enabled=true
