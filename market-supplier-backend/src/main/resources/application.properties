# Logger default level
app.logging.level=INFO

# Database Configuration - Local Development
spring.datasource.url=jdbc:postgresql://localhost:5432/tedarikAsistani
spring.datasource.username=postgres
spring.datasource.password=2323
spring.datasource.driver-class-name=org.postgresql.Driver

# Database Configuration - Production Server (commented out)
#spring.datasource.url=jdbc:postgresql://localhost:5432/tedarikAsistani
#spring.datasource.username=postgres
#spring.datasource.password=2323
#spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration - Disabled, using Hibernate DDL
spring.flyway.enabled=false

# Performance Configuration
app.cache.enabled=true
app.cache.default-ttl=300
app.cache.local-fallback=true

# Async Configuration
app.async.core-pool-size=5
app.async.max-pool-size=20
app.async.queue-capacity=100
app.async.thread-name-prefix=Async-

# Database Performance
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.datasource.hikari.auto-commit=false

# Logging Configuration
app.logging.level=INFO
app.logging.structured=true
app.logging.include-stack-trace=false
app.logging.service-name=market-supplier

# Logging Levels by Environment
logging.level.com.example.marketsupplier=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.data=WARN

# Logging Pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Log File Configuration
logging.file.name=logs/market-supplier.log
logging.file.max-size=10MB
logging.file.max-history=30

# Server Configuration
server.port=8080

# Session Configuration
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.servlet.session.cookie.max-age=1800

# Admin Bootstrap
app.admin.bootstrap.enabled=true
app.admin.bootstrap.email=admin@system.local
app.admin.bootstrap.name=System Admin
app.admin.bootstrap.password=admin123

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jackson JSON Mapper Configuration
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# Management/Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus,beans,env,loggers,threaddump,heapdump
management.endpoint.health.show-details=when_authorized
management.metrics.export.prometheus.enabled=true
management.endpoint.health.group.readiness.include=db
management.endpoint.health.group.liveness.include=ping

# Monitoring & Metrics Configuration
app.monitoring.enabled=true
app.monitoring.metrics.enabled=true
app.monitoring.health-check.enabled=true
app.monitoring.actuator.enabled=true

# Prometheus Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.info.enabled=true
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true

# Micrometer Configuration
management.metrics.export.prometheus.enabled=true
management.metrics.export.prometheus.step=30s
management.metrics.export.prometheus.descriptions=true
management.metrics.export.prometheus.histogram-flavor=prometheus

# Health Check Configuration
management.health.defaults.enabled=true
management.health.db.enabled=true
management.health.diskspace.enabled=true

# Custom Health Indicators
management.health.custom.enabled=true
management.health.custom.show-details=always

# Metrics Configuration
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.sla.http.server.requests=10ms,50ms,100ms,200ms,500ms,1s,2s,5s

# JVM Metrics
management.metrics.enable.jvm=true
management.metrics.enable.system=true
management.metrics.enable.process=true
management.metrics.enable.logback=true

# JWT Configuration
jwt.secret=myVerySecretKeyForJWTTokenGenerationThatIs256BitsLongEnoughForSecurity
jwt.expiration=86400000

# Custom Metrics
management.metrics.tags.application=market-supplier
management.metrics.tags.environment=${spring.profiles.active:default}
management.metrics.tags.version=1.0.0
management.metrics.tags.instance=${spring.application.name:market-supplier}-${random.uuid}

# Logging Metrics
logging.level.io.micrometer=INFO
logging.level.io.micrometer.core.instrument=DEBUG
logging.level.io.micrometer.prometheus=DEBUG