# Staging Environment Configuration
spring.profiles.active=staging

# Database Configuration
spring.datasource.url=jdbc:postgresql://staging-db:5432/tedarikAsistani
spring.datasource.username=${DB_USERNAME:staging_user}
spring.datasource.password=${DB_PASSWORD:staging_password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Logging Configuration
app.logging.level=INFO
app.logging.structured=true
app.logging.include-stack-trace=false
app.logging.service-name=market-supplier-staging

# Feature Flags
app.features.caching.enabled=true
app.features.async-processing.enabled=true
app.features.validation.enabled=true
app.features.logging.enabled=true

# Cache Configuration
app.cache.enabled=true
app.cache.default-ttl=600
app.cache.local-fallback=true

# Async Configuration
app.async.core-pool-size=5
app.async.max-pool-size=25
app.async.queue-capacity=200
app.async.thread-name-prefix=Staging-Async-

# Security Configuration
app.security.input-sanitization.enabled=true

# Monitoring Configuration
app.monitoring.enabled=true
app.monitoring.metrics.enabled=true
app.monitoring.health-check.enabled=true
app.monitoring.actuator.enabled=true

# Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/
server.error.include-stacktrace=when_authorized
server.error.include-message=when_authorized

# Admin Configuration
app.admin.bootstrap.enabled=true