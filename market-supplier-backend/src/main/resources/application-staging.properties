# Staging Environment Configuration
spring.profiles.active=staging

# Database Configuration
spring.datasource.url=jdbc:postgresql://staging-db:5432/market_supplier_staging
spring.datasource.username=${DB_USERNAME:staging_user}
spring.datasource.password=${DB_PASSWORD:staging_password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:staging-redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=1

# Logging Configuration
app.logging.level=INFO
app.logging.structured=true
app.logging.include-stack-trace=false
app.logging.service-name=market-supplier-staging

# Feature Flags
app.features.ai-agent.enabled=true
app.features.whatsapp.enabled=true
app.features.redis.enabled=true
app.features.circuit-breaker.enabled=true
app.features.rate-limiting.enabled=true
app.features.validation.enabled=true
app.features.logging.enabled=true
app.features.caching.enabled=true
app.features.async-processing.enabled=true

# AI Configuration
app.ai.provider=${AI_PROVIDER:groq}
app.ai.model=${AI_MODEL:gpt-3.5-turbo}
app.ai.max-tokens=2000
app.ai.temperature=0.5
app.ai.timeout=60000

# WhatsApp Configuration
app.whatsapp.access_token=${WHATSAPP_ACCESS_TOKEN}
app.whatsapp.phone_number_id=${WHATSAPP_PHONE_NUMBER_ID}
app.whatsapp.verify_token=${WHATSAPP_VERIFY_TOKEN}
app.whatsapp.webhook_url=${WHATSAPP_WEBHOOK_URL:https://staging.example.com/api/whatsapp/webhook}

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=7200000
app.jwt.refresh-expiration=172800000

# Rate Limiting Configuration
app.rate-limit.window-size-ms=60000
app.rate-limit.max-per-window=200
app.rate-limit.max-per-minute=120
app.rate-limit.max-per-hour=2000

# Circuit Breaker Configuration
app.circuit-breaker.failure-threshold=5
app.circuit-breaker.timeout-duration=60
app.circuit-breaker.retry-timeout=30

# Retry Configuration
app.retry.max-attempts=3
app.retry.initial-delay=1000
app.retry.max-delay=10000
app.retry.multiplier=2.0
app.retry.jitter=true

# Cache Configuration
app.cache.enabled=true
app.cache.default-ttl=600
app.cache.local-fallback=true
app.cache.redis.enabled=true

# Async Configuration
app.async.core-pool-size=5
app.async.max-pool-size=20
app.async.queue-capacity=100
app.async.thread-name-prefix=Staging-Async-

# Resilience Configuration
app.resilience.llm.enabled=true
app.resilience.redis.enabled=true
app.resilience.whatsapp.enabled=true

# Security Configuration
app.security.input-sanitization.enabled=true
app.security.rate-limiting.enabled=true
app.security.jwt-validation.enabled=true

# Monitoring Configuration
app.monitoring.enabled=true
app.monitoring.metrics.enabled=true
app.monitoring.health-check.enabled=true
app.monitoring.actuator.enabled=true

# Server Configuration
server.port=8080
server.servlet.context-path=/
server.error.include-stacktrace=when_authorized
server.error.include-message=always

# Admin Configuration
app.admin.bootstrap-token=${ADMIN_BOOTSTRAP_TOKEN}
app.admin.enabled=true
