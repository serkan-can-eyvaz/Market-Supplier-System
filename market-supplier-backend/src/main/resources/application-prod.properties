# Production Environment Configuration
spring.profiles.active=prod

# Database Configuration
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Redis Configuration
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.database=${REDIS_DATABASE:0}

# Logging Configuration
app.logging.level=WARN
app.logging.structured=true
app.logging.include-stack-trace=false
app.logging.service-name=market-supplier-prod

# Feature Flags
app.features.ai-agent.enabled=${AI_AGENT_ENABLED:true}
app.features.whatsapp.enabled=${WHATSAPP_ENABLED:true}
app.features.redis.enabled=${REDIS_ENABLED:true}
app.features.circuit-breaker.enabled=${CIRCUIT_BREAKER_ENABLED:true}
app.features.rate-limiting.enabled=${RATE_LIMITING_ENABLED:true}
app.features.validation.enabled=${VALIDATION_ENABLED:true}
app.features.logging.enabled=${LOGGING_ENABLED:true}
app.features.caching.enabled=${CACHING_ENABLED:true}
app.features.async-processing.enabled=${ASYNC_PROCESSING_ENABLED:true}

# AI Configuration
app.ai.provider=${AI_PROVIDER:groq}
app.ai.model=${AI_MODEL:gpt-4}
app.ai.max-tokens=4000
app.ai.temperature=0.3
app.ai.timeout=120000

# WhatsApp Configuration
app.whatsapp.access_token=${WHATSAPP_ACCESS_TOKEN}
app.whatsapp.phone_number_id=${WHATSAPP_PHONE_NUMBER_ID}
app.whatsapp.verify_token=${WHATSAPP_VERIFY_TOKEN}
app.whatsapp.webhook_url=${WHATSAPP_WEBHOOK_URL}

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=1800000
app.jwt.refresh-expiration=86400000

# Rate Limiting Configuration
app.rate-limit.window-size-ms=60000
app.rate-limit.max-per-window=500
app.rate-limit.max-per-minute=300
app.rate-limit.max-per-hour=5000

# Circuit Breaker Configuration
app.circuit-breaker.failure-threshold=10
app.circuit-breaker.timeout-duration=120
app.circuit-breaker.retry-timeout=60

# Retry Configuration
app.retry.max-attempts=5
app.retry.initial-delay=2000
app.retry.max-delay=30000
app.retry.multiplier=2.0
app.retry.jitter=true

# Cache Configuration
app.cache.enabled=true
app.cache.default-ttl=1800
app.cache.local-fallback=false
app.cache.redis.enabled=true

# Async Configuration
app.async.core-pool-size=10
app.async.max-pool-size=50
app.async.queue-capacity=500
app.async.thread-name-prefix=Prod-Async-

# Resilience Configuration
app.resilience.llm.enabled=true
app.resilience.redis.enabled=true
app.resilience.whatsapp.enabled=true

# Security Configuration
app.security.input-sanitization.enabled=true
app.security.rate-limiting.enabled=true
app.security.jwt-validation.enabled=true

# Monitoring Configuration
app.monitoring.enabled=true
app.monitoring.metrics.enabled=true
app.monitoring.health-check.enabled=true
app.monitoring.actuator.enabled=true

# Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/
server.error.include-stacktrace=never
server.error.include-message=never

# Admin Configuration
app.admin.bootstrap-token=${ADMIN_BOOTSTRAP_TOKEN}
app.admin.enabled=${ADMIN_ENABLED:false}
