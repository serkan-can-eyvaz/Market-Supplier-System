name: market_supplier_app
description: Market Supplier System Mobile App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.0.5
  
  # HTTP Requests
  http: ^1.1.0
  dio: ^5.3.2
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # Navigation
  go_router: ^10.1.2
  
  # UI Components
  cupertino_icons: ^1.0.2
  
  # Maps
  google_maps_flutter: ^2.5.0
  location: ^5.0.3
  
  # PDF Viewing
  flutter_pdfview: ^1.3.2
  
  # Date & Time
  intl: ^0.18.1
  
  # JSON Serialization
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^2.0.0
  json_serializable: ^6.7.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  
